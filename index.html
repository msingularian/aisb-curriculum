<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Interactive map of the AI Second Brain Cohort 2 curriculum: how the eight modules connect into one context architecture.">
<title>AI Second Brain Curriculum Map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
  /* AISB brand: black surfaces, Poppins, warm-spectrum gradient on lines and dots only. Single-theme by design. */
  :root {
    --bg: #000000;
    --bg-2: #1a1a1a;
    --bg-3: #242424;
    --ink: #ffffff;
    --ink-2: #b0b0b0;
    --ink-3: #9a9a9a;
    --rule: #5a5a5a;
    --rule-soft: #333333;
    --cyan: #46e1bd;
    --warm: linear-gradient(90deg, #e84393 0%, #fd79a8 20%, #e74c3c 40%, #e67e22 60%, #f39c12 80%, #f1c40f 100%);
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
    --ease-in: cubic-bezier(0.16, 1, 0.3, 1);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-weight: 500;
    font-size: 16px;
    line-height: 1.55;
    padding-inline: 20px;
    padding-block: 40px 72px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  a { color: var(--ink); }

  .eyebrow { font-size: 13px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
  header { display: flex; justify-content: space-between; align-items: center; gap: 32px; margin-bottom: 36px; padding-top: 4px; }
  .logo { display: block; height: 22px; width: auto; margin-bottom: 44px; }
  h1 { font-weight: 700; font-size: clamp(32px, 4.2vw, 48px); line-height: 1.1; letter-spacing: -0.01em; margin: 0 0 0 -0.04em; text-wrap: balance; }
  h1 .grad { background: var(--warm); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .meta { display: flex; gap: 22px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); font-weight: 400; letter-spacing: 0.02em; }
  .meta span b { color: var(--ink); font-weight: 600; }
  .waves { width: 200px; max-width: 100%; height: auto; display: block; flex: none; }

  /* System diagram */
  .system { background: var(--bg-2); border: 1px solid var(--rule-soft); border-radius: 8px; padding: 22px 22px 16px; margin-bottom: 28px; }
  .system-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 10px; }
  .system-head h2 { font-weight: 700; font-size: 28px; letter-spacing: -0.01em; margin: 0; }
  .system-head p { margin: 0; color: var(--ink-2); font-size: 14px; font-weight: 400; letter-spacing: 0.02em; }
  .system svg { width: 100%; height: auto; display: block; }
  .system svg text { font-family: "Poppins", system-ui, sans-serif; fill: var(--ink); font-weight: 500; }
  .system svg .mono { fill: var(--ink-2); font-size: 11px; letter-spacing: 0.1em; font-weight: 500; }
  .system svg .edge { stroke: var(--rule); stroke-width: 1.5; fill: none; transition: stroke .2s var(--ease), opacity .2s var(--ease); }
  .system svg .edge.dashed { stroke-dasharray: 4 4; }
  .system svg .edge.on { stroke: url(#warm); stroke-width: 2.2; }
  .system svg .edge.off { opacity: 0.7; }
  .system svg .node { cursor: pointer; transition: opacity .2s var(--ease); }
  .system svg .node rect { fill: var(--bg-3); stroke: var(--rule); stroke-width: 1.5; transition: stroke .2s var(--ease), fill .2s var(--ease); }
  .system svg .node .title { font-size: 13px; font-weight: 600; }
  .system svg .node .role { font-size: 12px; fill: var(--ink-2); font-weight: 400; }
  .system svg .node .num { font-size: 11px; fill: var(--ink-2); letter-spacing: 0.1em; }
  .system svg .node:hover rect { stroke: var(--ink-2); }
  .system svg .node.on rect { stroke: url(#warm); stroke-width: 2.5; fill: #000000; }
  .system svg .node.on .num { fill: var(--ink); }
  .system svg .node.off { opacity: 0.75; }
  .system svg .node:focus { outline: none; }
  .system svg .node:focus-visible rect { stroke: var(--ink); stroke-dasharray: 3 3; }
  .system svg .src { fill: var(--bg-2); stroke: var(--rule); stroke-dasharray: 3 3; }
  .system svg .srctext { font-size: 12px; fill: var(--ink-2); font-weight: 400; }
  .system svg .human circle, .system svg .human path { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; }
  .system svg .human .mono { fill: var(--ink); }
  .system svg .step rect { fill: var(--bg-2); stroke: var(--ink-3); stroke-width: 1.5; }
  .system svg .step .title { font-size: 13px; font-weight: 600; }
  .system svg .step .role { font-size: 12px; fill: var(--ink-2); font-weight: 400; }
  .system svg .step.core rect { stroke: var(--ink); stroke-width: 2; fill: #000000; }
  .system svg .band rect { fill: none; stroke: var(--cyan); stroke-dasharray: 5 4; }
  .system svg .band.on rect { fill: rgba(70,225,189,0.08); stroke-width: 2; }
  .system svg .band .title { fill: var(--cyan); }
  .legend { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 12px; font-size: 13px; color: var(--ink-2); font-weight: 400; letter-spacing: 0.02em; }
  .legend i { display: inline-block; width: 24px; height: 2px; background: var(--warm); vertical-align: middle; margin-right: 8px; }
  .legend i.d { background: repeating-linear-gradient(90deg, var(--ink-3) 0 4px, transparent 4px 8px); }
  .legend i.a { background: repeating-linear-gradient(90deg, var(--cyan) 0 5px, transparent 5px 9px); }

  /* Walkthrough */
  .walk { display: grid; grid-template-columns: 240px 1fr; gap: 24px; align-items: start; }
  .rail { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 4px; }
  .rail h3 { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 8px 10px; font-weight: 500; }
  .rail button {
    display: grid; grid-template-columns: 34px 1fr; align-items: baseline; gap: 6px;
    text-align: left; background: transparent; border: 1px solid transparent; border-radius: 6px;
    padding: 8px 10px; color: var(--ink-2); font: inherit; font-weight: 400; font-size: 14px; cursor: pointer;
    transition: background .12s var(--ease), color .12s var(--ease);
  }
  .rail button .n { font-size: 12px; color: var(--ink-2); letter-spacing: 0.06em; }
  .rail button:hover { background: var(--bg-2); color: var(--ink); }
  .rail button.on { background: var(--bg-2); border-color: var(--rule); color: var(--ink); font-weight: 600; }
  .rail button.on .n { color: var(--ink); }
  .rail button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .rail .done { margin-top: 12px; padding: 10px; border-top: 1px solid var(--rule-soft); font-size: 13px; color: var(--ink-2); font-weight: 400; }
  .rail .done .bar { height: 2px; background: var(--rule-soft); border-radius: 1px; margin-top: 8px; overflow: hidden; }
  .rail .done .bar b { display: block; height: 100%; background: var(--warm); transition: width .4s var(--ease); }

  .panel { background: var(--bg-2); border: 1px solid var(--rule-soft); border-radius: 8px; padding: 32px 36px 28px; min-height: 480px; }
  .panel-top { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  .panel .eyebrow .role { color: var(--ink-2); }
  .panel h2 { font-weight: 700; font-size: clamp(30px, 4vw, 44px); line-height: 1.1; letter-spacing: -0.01em; margin: 10px 0 6px; text-wrap: balance; }
  .panel .sub { font-size: 18px; color: var(--ink-2); margin: 0 0 26px; font-weight: 400; }
  .panel h4 { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 12px; font-weight: 500; }
  .learn { list-style: none; padding: 0; margin: 0 0 26px; display: grid; gap: 10px; }
  .learn li { display: grid; grid-template-columns: 22px 1fr; gap: 12px; align-items: start; color: var(--ink); font-weight: 400; max-width: 62em; }
  .learn li .tick { width: 24px; height: 24px; border: 1.5px solid var(--rule); border-radius: 50%; display: grid; place-items: center; font-size: 11px; color: var(--ink-2); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .takeaway { position: relative; background: #000000; padding: 18px 22px 18px 26px; border-radius: 6px; border: 1px solid var(--rule-soft); }
  .takeaway::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 2px; background: linear-gradient(180deg, #e84393, #fd79a8, #e74c3c, #e67e22, #f39c12, #f1c40f); }
  .takeaway h4 { color: var(--ink-2); margin-bottom: 6px; }
  .takeaway p { margin: 0; font-size: 17px; font-weight: 500; }
  .flows { display: flex; gap: 28px; flex-wrap: wrap; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--rule-soft); font-size: 14px; color: var(--ink-2); font-weight: 400; }
  .flows div span { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); display: block; margin-bottom: 2px; font-weight: 500; }
  .flows button { background: none; border: none; padding: 0; font: inherit; color: var(--ink); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--rule); }
  .flows button:hover { text-decoration-color: var(--ink); }
  .nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 26px; }
  .nav button { font: inherit; font-weight: 600; font-size: 14px; color: var(--ink); background: transparent; border: 1px solid var(--rule); border-radius: 6px; padding: 11px 18px; min-height: 44px; cursor: pointer; transition: border-color .12s var(--ease), background .12s var(--ease); }
  .nav button:hover:not(:disabled) { border-color: var(--ink-2); }
  .nav button.primary { background: var(--ink); color: #1a1a1a; border-color: var(--ink); }
  .nav button.primary:hover:not(:disabled) { background: #e6e6e6; }
  .nav button:disabled { opacity: 0.35; cursor: default; }
  .nav button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .hint { text-align: right; font-size: 12px; color: var(--ink-2); margin-top: 10px; font-weight: 400; letter-spacing: 0.02em; }

  .panel.enter { animation: rise .4s var(--ease-in); }
  @keyframes rise { from { opacity: 0.4; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .panel.enter { animation: none; } * { transition: none !important; } }

  footer { margin-top: 44px; color: var(--ink-2); font-size: 14px; font-weight: 400; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

  @media (max-width: 820px) {
    header { grid-template-columns: 1fr; align-items: start; }
    .waves { display: none; }
    .walk { grid-template-columns: 1fr; }
    .rail { position: static; flex-direction: row; flex-wrap: wrap; gap: 6px; }
    .rail h3 { flex-basis: 100%; }
    .rail button { grid-template-columns: auto; padding: 7px 10px; font-size: 13px; }
    .rail button .t { display: none; }
    .rail .done { display: none; }
    .panel { padding: 24px 20px; min-height: 0; }
  }
</style>
</head>
<body>

<script>
const MODULES = [
  { n: 0, role: "Memory", title: "The Master Prompt", sub: "Your AI's user manual",
    learn: [
      "The new bottleneck in modern productivity: not your time, attention, or intelligence, but collecting, curating, and providing context to increasingly powerful AI. We call this skill Personal Context Management",
      "Two diverging roads for how you use AI: the default path (accepting the AI's defaults, outsourcing your judgment, degrading your cognitive agency) versus context-maxxing (actively designing the context environment so AI amplifies your knowledge and judgment)",

const EDGES_BY_MODULE = {
  0: ["0-cw"],
  1: ["3-1","1-cw"],
  2: ["3-2","2-cw"],
  3: ["h-3","3-2","3-1"],
  4: ["cw-4","4-o"],
  5: ["cw-5","5-o"],
  6: ["cw-6","6-o"],
  7: ["7-h"]
};

const state = { current: 0, visited: new Set([0]) };
const panel = document.getElementById('panel');
const rail = document.getElementById('rail');
const doneEl = document.getElementById('done');

// Build rail
MODULES.forEach(m => {
  const b = document.createElement('button');
  b.type = 'button';
  b.dataset.m = m.n;
  b.innerHTML = `<span class="n">M${m.n}</span><span class="t">${m.title}</span>`;
  b.addEventListener('click', () => go(m.n));
  rail.insertBefore(b, doneEl);
});

function nameOf(i){ return `M${i} ${MODULES[i].title}`; }

function render() {
  const m = MODULES[state.current];
  const item = x => typeof x === 'number' ? `<button type="button" data-go="${x}">${nameOf(x)}</button>` : x;
  const fed = m.from.map(item).join(', ');
  const feeds = m.to.map(item).join(', ');
  panel.innerHTML = `
    <div class="panel-top">
      <div class="eyebrow">Module ${m.n} <span class="role">· ${m.role}</span></div>
      <div class="eyebrow">${m.n + 1} / 8</div>
    </div>
    <h2>${m.title}</h2>
    <p class="sub">${m.sub}</p>
    <h4>What you'll learn</h4>
    <ul class="learn">${m.learn.map((t, i) => `<li><span class="tick">${String(i+1).padStart(2,'0')}</span><span>${t}</span></li>`).join('')}</ul>
    <div class="takeaway"><h4>You'll walk away with</h4><p>${m.take}</p></div>
    <div class="flows">
      <div><span>${m.n === 7 ? 'Oversees' : 'Draws on'}</span>${fed}</div>
      <div><span>${m.n === 7 ? 'Closes with' : 'Feeds'}</span>${feeds}</div>
    </div>
    <div class="nav">
      <button type="button" id="prev" ${state.current === 0 ? 'disabled' : ''}>${state.current === 0 ? 'Start' : '← Module ' + (state.current - 1)}</button>
      <button type="button" id="next" class="primary" ${state.current === 7 ? 'disabled' : ''}>${state.current === 7 ? 'You\'re a Context Architect' : 'Module ' + (state.current + 1) + ' →'}</button>
    </div>
    <div class="hint">← → arrow keys move between modules</div>
  `;
  panel.classList.remove('enter'); void panel.offsetWidth; panel.classList.add('enter');
  panel.querySelector('#prev').addEventListener('click', () => go(state.current - 1));
  panel.querySelector('#next').addEventListener('click', () => go(state.current + 1));
  panel.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => go(+b.dataset.go)));

  rail.querySelectorAll('button[data-m]').forEach(b => b.classList.toggle('on', +b.dataset.m === state.current));
  document.getElementById('dcount').textContent = state.visited.size;
  document.getElementById('dbar').style.width = (state.visited.size / 8 * 100) + '%';

  const on = EDGES_BY_MODULE[state.current];
  document.querySelectorAll('#sys .edge').forEach(e => {
    const isOn = on.includes(e.dataset.e);
    e.classList.toggle('on', isOn); e.classList.toggle('off', !isOn);
  });
  document.querySelectorAll('#sys .node').forEach(n => {
    const i = +n.dataset.m;
    const related = i === state.current || m.from.includes(i) || m.to.includes(i) || state.current === 7;
    n.classList.toggle('on', i === state.current);
    n.classList.toggle('off', !related);
  });
}

function go(i) {
  if (i < 0 || i > 7) return;
  state.current = i; state.visited.add(i);
  try { localStorage.setItem('aisb-c2-visited', JSON.stringify([...state.visited])); } catch (e) {}
  render();
}

document.querySelectorAll('#sys .node').forEach(n => {
  n.addEventListener('click', () => { go(+n.dataset.m); document.getElementById('panel').scrollIntoView({ behavior: 'smooth', block: 'nearest' }); });
  n.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(+n.dataset.m); } });
});
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  if (e.key === 'ArrowRight') go(state.current + 1);
  if (e.key === 'ArrowLeft') go(state.current - 1);
});

try { const v = JSON.parse(localStorage.getItem('aisb-c2-visited') || '[]'); v.forEach(x => state.visited.add(x)); } catch (e) {}
render();
</script>
</body>
